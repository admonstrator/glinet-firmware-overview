name: Link Probe (diagnostic)

# Temporary diagnostic workflow: runs the normal build on a GitHub runner and
# prints why individual firmware links fail there, without deploying anything.
# Remove once the question is answered.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/actions-logs-diskrepanz-rydrqj

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Network context
        run: |
          echo "--- runner egress IP ---"
          curl -s --max-time 10 https://api.ipify.org || echo "(ipify unreachable)"
          echo
          echo "--- DNS for fw.gl-inet.com ---"
          getent ahosts fw.gl-inet.com || true
          echo
          for url in \
            "https://fw.gl-inet.com/firmware/mt300n/tor/openwrt-gl-mt300n-tor-luci-1.0.bin" \
            "https://fw.gl-inet.com/firmware/s10/standard/gl-s10-2.3.1.bin" \
            "https://fw.gl-inet.com/firmware/axt1800/release/axt1800-4.8.3_release1-815-0413-1776065915.tar" \
            "https://fw.gl-inet.com/firmware/axt1800/release/axt1800-4.8.2-0904-1756977846.tar" ; do
            echo "=============================================================="
            echo "HEAD $url"
            curl -sS -I --max-time 20 -A 'Mozilla/5.0' "$url" 2>&1 | head -25 || true
            echo "-- first 64 bytes via ranged GET --"
            curl -sS -o /dev/null --max-time 20 -A 'Mozilla/5.0' -r 0-63 \
                 -w 'http_code=%{http_code} size=%{size_download} time_total=%{time_total}s remote_ip=%{remote_ip}\n' \
                 "$url" 2>&1 | tail -3 || true
          done

      - name: Run the real build (no deploy)
        run: |
          python3 fetch_all_models.py
          python3 generate_page.py
